<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Ilustración de kit inicial: caja de cartón con macetas, sustrato y semillas">
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect y="510" width="1200" height="120" fill="#e7dfcc"/>
  <rect y="506" width="1200" height="8" fill="#cbbfa4"/>

  <!-- caja abierta -->
  <g>
    <path d="M330 260 L600 200 L870 260 L870 510 L330 510 Z" fill="#c9a06a"/>
    <path d="M330 260 L600 200 L600 510 L330 510 Z" fill="#b98d55"/>
    <path d="M600 200 L870 260 L870 510 L600 510 Z" fill="#d4ad78"/>
    <!-- solapas -->
    <path d="M330 260 L470 150 L600 200 Z" fill="#e0bd8c"/>
    <path d="M870 260 L730 150 L600 200 Z" fill="#e0bd8c"/>
  </g>

  <!-- maceta dentro -->
  <g>
    <path d="M400 350 L520 350 L508 440 L412 440 Z" fill="#c17a52"/>
    <rect x="392" y="338" width="136" height="18" rx="5" fill="#a85f3a"/>
    <g fill="#6f9a5f">
      <ellipse cx="440" cy="330" rx="26" ry="16"/>
      <ellipse cx="480" cy="330" rx="26" ry="16"/>
    </g>
  </g>

  <!-- saquito de sustrato -->
  <g>
    <path d="M620 340 L760 340 L750 450 L630 450 Z" fill="#8a6142"/>
    <rect x="612" y="328" width="156" height="20" rx="6" fill="#6f4a30"/>
    <text x="686" y="410" font-family="system-ui, sans-serif" font-size="26" fill="#f6f2e9" text-anchor="middle">sustrato</text>
  </g>

  <!-- sobre de semillas -->
  <g transform="rotate(-8 900 300)">
    <rect x="820" y="250" width="180" height="120" rx="8" fill="#eaf2e6" stroke="#6f9a5f" stroke-width="5"/>
    <circle cx="870" cy="300" r="16" fill="#6f9a5f"/>
    <circle cx="900" cy="286" r="12" fill="#7fae6c"/>
    <g stroke="#5f8a50" stroke-width="4" stroke-linecap="round">
      <path d="M920 320 L980 320"/><path d="M920 340 L960 340"/>
    </g>
  </g>

  <!-- semillas sueltas -->
  <g fill="#8a6142">
    <ellipse cx="700" cy="480" rx="12" ry="8"/>
    <ellipse cx="740" cy="492" rx="12" ry="8"/>
    <ellipse cx="780" cy="478" rx="12" ry="8"/>
  </g>
</svg>
