<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Ilustración de diseño de balcones: plano con macetas distribuidas y una mesa">
  <rect width="1200" height="630" fill="#f6f2e9"/>

  <!-- plano -->
  <g>
    <rect x="120" y="90" width="720" height="450" fill="#fff" stroke="#2f5d3a" stroke-width="6"/>
    <!-- barandilla -->
    <g stroke="#6f9a5f" stroke-width="8">
      <path d="M120 540 L840 540"/>
    </g>
    <!-- puerta -->
    <path d="M600 90 L600 190 L700 90 Z" fill="#e7dfcc" stroke="#8a6142" stroke-width="4"/>

    <!-- macetas en planta (circulos) -->
    <g fill="#6f9a5f">
      <circle cx="200" cy="480" r="30"/><circle cx="280" cy="480" r="30"/>
      <circle cx="360" cy="480" r="30"/><circle cx="440" cy="480" r="30"/>
    </g>
    <g fill="#c17a52">
      <circle cx="200" cy="180" r="34"/><circle cx="300" cy="180" r="34"/>
    </g>
    <!-- jardinera larga -->
    <rect x="520" y="440" width="260" height="60" rx="8" fill="#d08a5f"/>
    <g fill="#6f9a5f">
      <circle cx="560" cy="470" r="18"/><circle cx="620" cy="470" r="18"/>
      <circle cx="680" cy="470" r="18"/><circle cx="740" cy="470" r="18"/>
    </g>
    <!-- mesa -->
    <rect x="520" y="200" width="160" height="160" rx="10" fill="#e7dfcc" stroke="#8a6142" stroke-width="5"/>
    <circle cx="600" cy="280" r="40" fill="#c17a52"/>
  </g>

  <!-- regla / medida -->
  <g stroke="#8a8a7a" stroke-width="4">
    <path d="M120 40 L840 40"/>
    <path d="M120 30 L120 50"/><path d="M480 30 L480 50"/><path d="M840 30 L840 50"/>
  </g>
  <text x="480" y="28" font-family="system-ui, sans-serif" font-size="22" fill="#6b7266" text-anchor="middle">3 m</text>

  <!-- lapiz -->
  <g transform="translate(940 220) rotate(35)">
    <rect x="0" y="0" width="26" height="200" fill="#f2e3b8"/>
    <path d="M0 200 L26 200 L13 240 Z" fill="#8a6142"/>
    <rect x="0" y="0" width="26" height="26" fill="#d98a9a"/>
  </g>
</svg>
